spring.application.name=hortifruti

# Banco local: H2. No Render, DATABASE_URL será usada pelo código de configuração.
spring.datasource.url=jdbc:h2:file:./data/hortifruti
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# No Render usa a porta fornecida pelo ambiente.
# Localmente, se PORT não existir, usa 8080.
server.port=${PORT:8080}

# Proteção simples, exclusivamente acadêmica, para evitar uma limpeza acidental.
hortifruti.limpeza.senha=2340