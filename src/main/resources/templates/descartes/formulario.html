<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descarte | Horti Fruti Ponto Certo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navegacao :: principal}"></div>
    <main class="container formulario-container">
        <a class="voltar" th:href="@{/produtos}">← Voltar para produtos</a>

        <section class="card">
            <p class="marca">Horti Fruti Ponto Certo</p>
            <h1>Registrar descarte</h1>
            <p class="subtitulo">Informe o produto, a quantidade descartada e o motivo.</p>

            <p class="erro-geral" th:if="${erro}" th:text="${erro}"></p>

            <form th:action="@{/descartes}" method="post">
                <div class="campo">
                    <label for="produtoId">Produto</label>
                    <select id="produtoId" name="produtoId" required>
                        <option value="">Selecione um produto</option>
                        <option th:each="produto : ${produtos}"
                                th:value="${produto.id}"
                                th:text="${produto.nome + ' (' + produto.quantidade + ' ' + produto.unidade + ')'}"
                                th:selected="${produto.id == produtoId}"></option>
                    </select>
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade descartada</label>
                    <input id="quantidade" name="quantidade" type="number" min="0.01" step="0.01"
                           th:value="${quantidade}" required>
                </div>

                <div class="campo">
                    <label for="motivo">Motivo</label>
                    <select id="motivo" name="motivo" required>
                        <option value="">Selecione um motivo</option>
                        <option value="Má aparência" th:selected="${motivo == 'Má aparência'}">Má aparência</option>
                        <option value="Vencimento" th:selected="${motivo == 'Vencimento'}">Vencimento</option>
                        <option value="Produto danificado" th:selected="${motivo == 'Produto danificado'}">Produto danificado</option>
                        <option value="Outro" th:selected="${motivo == 'Outro'}">Outro</option>
                    </select>
                </div>

                <button class="botao" type="submit">Confirmar descarte</button>
            </form>
        </section>
    </main>
</body>
</html>
